<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bugník</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐞</text></svg>">
<style>
/* Vždy tmavé: bílé písmo na černém, kvůli kontrastu. */
:root {
  color-scheme: dark;
  --bg: #000; --panel: #111317; --card: #1a1d23; --text: #fff; --muted: #b4bac4;
  --line: #3a3f48; --accent: #7aa7ff; --accent-soft: #1c2c4d; --btn: #2f6fed;
  --p1: #ff6b6b; --p2: #ffb340; --p3: #8b929c;
  --ok: #5ee38a; --flash: #5b4a12; --odznak: #e5484d;
  --shadow: 0 1px 2px rgb(0 0 0 / .6);
}
::placeholder { color: var(--muted); opacity: 1; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* ── Přihlášení ─────────────────────────────────────────── */
#login { display: grid; place-items: center; min-height: 100%; padding: 16px; }
#login form {
  background: var(--card); padding: 28px; border-radius: 12px; box-shadow: var(--shadow);
  width: 100%; max-width: 340px; display: grid; gap: 12px;
}
#login h1 { margin: 0 0 4px; font-size: 22px; }
#login .chyba { color: var(--p1); font-size: 13px; min-height: 1em; }

input, select, textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.btn {
  border: 1px solid var(--line); background: var(--card); border-radius: 8px;
  padding: 7px 12px; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--btn); border-color: var(--btn); color: #fff; font-weight: 600; }
.btn.primary:hover { border-color: var(--text); }
.btn.danger { color: var(--p1); }

/* ── Horní lišta ────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 12px 16px 0; border-bottom: 1px solid var(--line);
}
header .logo { font-weight: 700; font-size: 18px; margin-right: 8px; }
header .filtry { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; align-items: center; }
header .filtry input[type=search] { max-width: 220px; }
header .filtry select { width: auto; }
header label.chk { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
header label.chk input { width: auto; }
.ja { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.ja b { color: var(--text); cursor: pointer; border-bottom: 1px dashed var(--muted); }
.spojeni { width: 9px; height: 9px; border-radius: 50%; background: var(--p3); }
.spojeni.ok { background: var(--ok); }

nav.taby { flex: 1 1 100%; display: flex; gap: 2px; overflow-x: auto; margin-top: 4px; }
nav.taby button {
  border: none; background: none; padding: 8px 14px; color: var(--muted); white-space: nowrap;
  border-bottom: 2px solid transparent; font-weight: 600;
  display: inline-flex; gap: 6px; align-items: center;
}
.ik-svg { width: 16px; height: 16px; flex: none; }
nav.taby button:hover { color: var(--text); }
nav.taby button.aktivni { color: var(--accent); border-bottom-color: var(--accent); }
nav.taby .n { font-weight: 400; }

/* ── Přehled (kanban) ───────────────────────────────────── */
main.kanban {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
  padding: 16px; align-items: start;
}
.sloupec {
  background: var(--panel); border-radius: 12px; padding: 10px;
  display: flex; flex-direction: column; gap: 8px; min-height: 200px;
}
.sloupec.nad { outline: 2px dashed var(--accent); outline-offset: -2px; }
.sloupec h2 {
  margin: 2px 4px 2px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em;
  color: var(--text); display: flex; justify-content: space-between; align-items: center;
}
.sloupec h2 .hl { display: inline-flex; gap: 6px; align-items: center; }
.sloupec[data-stav="nahlaseno"] h2 .ik-svg { color: var(--accent); }
.sloupec[data-stav="resi_se"] h2 .ik-svg { color: var(--p2); }
.sloupec[data-stav="vyreseno"] h2 .ik-svg { color: var(--ok); }
.sloupec h2 .pocet { background: var(--card); border-radius: 99px; padding: 0 8px; }
.rychly input { background: var(--card); }
.karty { display: flex; flex-direction: column; gap: 8px; min-height: 40px; }
.dalsi { background: none; border: none; color: var(--accent); padding: 4px; }

.karta {
  background: var(--card); border-radius: 8px; padding: 9px 10px 8px 12px;
  box-shadow: var(--shadow); cursor: pointer; position: relative;
  border-left: 4px solid var(--p3); transition: background .6s;
}
.karta[data-p="1"] { border-left-color: var(--p1); }
.karta[data-p="2"] { border-left-color: var(--p2); }
.karta:hover { outline: 1px solid var(--line); }
.karta.tahnu { opacity: .4; }
.blik { background: var(--flash) !important; transition: none !important; }
.karta .nazev { font-weight: 600; word-break: break-word; }
.sloupec[data-stav="vyreseno"] .karta .nazev { text-decoration: line-through; color: var(--muted); }
.karta .meta {
  display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 6px;
  font-size: 12px; color: var(--muted); align-items: center;
}
.tag { background: var(--accent-soft); color: var(--accent); border-radius: 4px; padding: 0 6px; font-weight: 600; }
.tag.vrstva { background: none; color: var(--text); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; }
.karta .sipky { margin-left: auto; display: flex; gap: 2px; }
.karta .sipky button {
  border: none; background: none; color: var(--muted); padding: 0 5px; font-size: 15px; border-radius: 4px;
}
.karta .sipky button:hover { background: var(--panel); color: var(--text); }
.misto { height: 3px; background: var(--accent); border-radius: 2px; }

/* ── Tabulka (taby se stavem) ───────────────────────────── */
main.tabulka { padding: 16px; }
.prazdno { color: var(--muted); padding: 40px 0; text-align: center; }
table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
th, td { text-align: left; padding: 10px 12px; vertical-align: top; border-bottom: 1px solid var(--line); }
th {
  font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel);
  cursor: pointer; user-select: none; white-space: nowrap;
}
th:hover { color: var(--text); }
th .smer { color: var(--accent); }
tbody tr { cursor: pointer; transition: background .6s; }
tbody tr:hover { background: var(--bg); }
tbody tr:last-child td { border-bottom: none; }
th.pruh, td.pruh { padding: 0; width: 4px; min-width: 4px; }
td.pruh { background: var(--p3); }
tr[data-p="1"] td.pruh { background: var(--p1); }
tr[data-p="2"] td.pruh { background: var(--p2); }
td .nazev { font-weight: 600; word-break: break-word; }
td .popis, td .reseni {
  color: var(--muted); font-size: 13px; margin-top: 2px; white-space: pre-line;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
td .reseni { color: var(--ok); }
td.maly { white-space: nowrap; color: var(--muted); font-size: 13px; }
.nahledy { display: flex; flex-wrap: wrap; gap: 6px; }
.nahledy img {
  width: 72px; height: 54px; object-fit: cover; border-radius: 6px;
  border: 1px solid var(--line); cursor: zoom-in; background: var(--panel);
}

/* ── Detail bugu ────────────────────────────────────────── */
dialog {
  border: none; border-radius: 12px; padding: 0; width: min(640px, calc(100% - 32px));
  background: var(--card); color: var(--text); box-shadow: 0 10px 40px rgb(0 0 0 / .3);
}
dialog::backdrop { background: rgb(0 0 0 / .45); }
#detail { width: min(1040px, calc(100% - 32px)); max-height: calc(100vh - 32px); overflow: hidden; }
/* Varianta B: obsah vlevo (název a popis stejně široké), nastavení v panelu vpravo. */
.detail {
  display: grid; grid-template-columns: minmax(0, 1fr) 290px; max-height: calc(100vh - 32px); overflow-y: auto;
}
.detail .levy { padding: 22px 26px; display: grid; gap: 18px; align-content: start; }
.detail .bok {
  background: var(--panel); border-left: 1px solid var(--line); padding: 22px 20px;
  display: grid; gap: 16px; align-content: start;
}
.detail .id-radek { font-size: 13px; color: var(--muted); font-weight: 600; }
.detail .pole { display: grid; gap: 7px; }
.detail .popisek { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.detail textarea, .detail input:not([type=radio]) { background: var(--bg); border: 1px solid var(--line); }
.detail .nazev-in {
  font-size: 22px; font-weight: 650; line-height: 1.3; resize: none; overflow: hidden;
  padding: 8px 10px; border-color: transparent; background: none;
}
.detail .nazev-in:hover { border-color: var(--line); }
.detail .nazev-in:focus { background: var(--bg); }
.detail .popis-in, .detail .reseni-in {
  font-size: 15px; line-height: 1.7; padding: 12px 14px; border-radius: 10px; resize: none; overflow: hidden;
}
.detail .popis-in { min-height: 300px; }
.detail .reseni-in { min-height: 90px; }
.detail .info { font-size: 13px; color: var(--muted); display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 14px; }
.detail .info b { color: var(--text); font-weight: 600; }
.detail .akce { display: flex; gap: 8px; justify-content: space-between; }
.detail .ulozeno { color: var(--ok); }

/* Přepínače (stav, priorita, typ, řeší) */
.seg { display: flex; flex-wrap: wrap; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
.seg-v { flex: 1 1 auto; position: relative; display: block; }
.seg-v input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; width: 100%; }
.seg-v span {
  display: block; text-align: center; padding: 7px 8px; border-radius: 7px; font-size: 13px;
  color: var(--muted); white-space: nowrap; pointer-events: none;
}
.seg-v:hover span { color: var(--text); }
.seg-v input:checked + span { background: var(--card); color: var(--text); font-weight: 700; box-shadow: var(--shadow); }
.seg-v input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg-v.s-nahlaseno input:checked + span { background: color-mix(in srgb, var(--accent) 28%, var(--card)); }
.seg-v.s-resi_se input:checked + span { background: color-mix(in srgb, var(--p2) 28%, var(--card)); }
.seg-v.s-vyreseno input:checked + span { background: color-mix(in srgb, var(--ok) 26%, var(--card)); }
.seg-v.p-1 input:checked + span { background: color-mix(in srgb, var(--p1) 28%, var(--card)); }
.seg-v.p-2 input:checked + span { background: color-mix(in srgb, var(--p2) 28%, var(--card)); }
.seg-v.p-3 input:checked + span { background: color-mix(in srgb, var(--p3) 35%, var(--card)); }

/* Mobil: jeden sloupec jako varianta A — název, nastavení, pak popis. */
@media (max-width: 800px) {
  #detail { width: calc(100% - 16px); max-height: calc(100vh - 16px); }
  .detail { display: flex; flex-direction: column; gap: 14px; padding: 16px; max-height: calc(100vh - 16px); }
  .detail .levy, .detail .bok { display: contents; }
  .detail .levy > *, .detail .bok > * { flex-shrink: 0; }  /* jinak flexbox smrskne název */
  .detail .m-hl { order: 1; } .detail .m-nazev { order: 2; } .detail .m-ovl { order: 3; }
  .detail .m-popis { order: 4; } .detail .m-res { order: 5; } .detail .m-obr { order: 6; }
  .detail .m-info { order: 7; } .detail .m-akce { order: 8; }
  .detail .nazev-in { font-size: 19px; padding: 6px 8px; }
  .detail .popis-in { min-height: 200px; }
}
.obrazky { display: flex; flex-wrap: wrap; gap: 8px; }
.obrazek { position: relative; }
.obrazek img {
  height: 90px; max-width: 160px; object-fit: cover; border-radius: 6px;
  border: 1px solid var(--line); cursor: zoom-in; display: block; min-width: 60px; background: var(--panel);
}
.obrazek button {
  position: absolute; top: 2px; right: 2px; border: none; border-radius: 50%;
  width: 22px; height: 22px; background: rgb(0 0 0 / .6); color: #fff; font-size: 12px;
}
.vlozit {
  border: 1px dashed var(--line); border-radius: 6px; height: 90px; padding: 0 14px;
  display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center;
  background: none;
}
#nahled { width: auto; max-width: 95vw; background: none; box-shadow: none; }
#nahled img { max-width: 95vw; max-height: 90vh; display: block; border-radius: 8px; }

/* ── Oznámení a nastavení ───────────────────────────────── */
.ikona-btn {
  position: relative; border: 1px solid var(--line); background: var(--card); border-radius: 8px;
  width: 36px; height: 36px; padding: 0; color: var(--muted);
  display: grid; place-items: center;
}
.ikona-btn svg { width: 19px; height: 19px; }
.ikona-btn:hover { border-color: var(--muted); color: var(--text); }
.odznak {
  position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 99px; background: var(--odznak); color: #fff; font-size: 11px; font-weight: 700;
  display: grid; place-items: center; line-height: 1; box-shadow: 0 0 0 2px var(--bg);
}
#oznameni { width: min(460px, calc(100% - 32px)); }
.panel { padding: 16px 18px; display: grid; gap: 12px; }
.panel h3 { margin: 0; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
.udalosti { display: grid; gap: 2px; max-height: 70vh; overflow-y: auto; margin: 0 -8px; }
.udalost {
  display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; padding: 8px; border-radius: 8px;
  cursor: pointer; text-align: left; border: none; background: none; width: 100%;
}
.udalost:hover { background: var(--bg); }
.udalost.nova { background: var(--accent-soft); }
.udalost .ik { font-size: 17px; grid-row: span 2; }
.udalost .co { font-weight: 600; word-break: break-word; }
.udalost .kdy { font-size: 12px; color: var(--muted); }
.udalost.pryc .co { text-decoration: line-through; color: var(--muted); }
#filtry { width: min(520px, calc(100% - 32px)); }
#filtry .mrizka { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
#filtry label { display: grid; gap: 5px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
#filtry select { font-size: 14px; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text); }
#filtry .akce { display: flex; justify-content: flex-end; }
@media (max-width: 500px) { #filtry .mrizka { grid-template-columns: 1fr; } }
#filtryBtn { display: inline-flex; gap: 6px; align-items: center; }
#filtryBtn.aktivni { border-color: var(--accent); color: var(--accent); }
.pocet-f { background: var(--accent); color: #000; border-radius: 99px; min-width: 18px; padding: 0 5px; font-size: 11px; font-weight: 700; text-align: center; }
#nastaveni { width: min(560px, calc(100% - 32px)); }
#nastaveni label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
#nastaveni label.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text); }
#nastaveni label.chk input { width: auto; }
#nastaveni .matice { width: 100%; border-collapse: collapse; font-size: 14px; box-shadow: none; background: none; display: table; }
#nastaveni .matice thead { display: table-header-group; }
#nastaveni .matice tbody { display: table-row-group; }
#nastaveni .matice tr { display: table-row; background: none; box-shadow: none; border: none; padding: 0; margin: 0; cursor: default; }
#nastaveni .matice th, #nastaveni .matice td {
  display: table-cell; padding: 6px 8px; border-bottom: 1px solid var(--line); background: none; cursor: default;
}
#nastaveni .matice th { font-size: 12px; }
#nastaveni .matice td:not(:first-child), #nastaveni .matice th:not(:first-child) { text-align: center; width: 80px; }
#nastaveni .matice input { width: auto; }
.tg-stav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--text); }
.tg-stav .ok { color: var(--ok); font-weight: 600; }
.poznamka { font-size: 12px; color: var(--muted); margin: 0; }

@media (max-width: 800px) {
  main.kanban { grid-template-columns: minmax(0, 1fr); }
  /* Logo a „já" na prvním řádku, filtry pod nimi přes celou šířku. */
  header .ja { margin-left: auto; }
  header .filtry { order: 3; flex: 1 1 100%; }
  header nav.taby { order: 4; }
  header .filtry input[type=search] { max-width: none; flex: 1 1 100%; }
  header .filtry select { flex: 1 1 40%; min-width: 0; }
  #novy { margin-left: auto; }

  /* Tabulka → karty pod sebou, popisky sloupců z data-label. */
  table, tbody, tr, td { display: block; }
  thead { display: none; }
  table { background: none; box-shadow: none; }
  tbody tr {
    background: var(--card); border-radius: 8px; margin-bottom: 8px; box-shadow: var(--shadow);
    border-left: 4px solid var(--p3); display: flex; flex-wrap: wrap; padding: 6px 4px;
  }
  tbody tr[data-p="1"] { border-left-color: var(--p1); }
  tbody tr[data-p="2"] { border-left-color: var(--p2); }
  td { border: none; padding: 4px 8px; }
  td.pruh, td.typ, td.cislo { display: none; }
  td.hlavni, td.obr { flex: 1 1 100%; }
  td.maly[data-label]::before { content: attr(data-label) ": "; }
}
</style>
</head>
<body>

<section id="login" hidden>
  <form>
    <h1>🐞 Bugník</h1>
    <input name="email" type="email" placeholder="E-mail" autocomplete="username" required>
    <input name="heslo" type="password" placeholder="Heslo" autocomplete="current-password" required>
    <button class="btn primary">Přihlásit</button>
    <div class="chyba"></div>
  </form>
</section>

<section id="app" hidden>
  <header>
    <span class="logo">🐞 Bugník</span>
    <div class="filtry">
      <input type="search" id="hledat" placeholder="Hledat… ( / )">
      <button class="btn" id="filtryBtn" title="Filtry (f)"><svg class="ik-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 20a1 1 0 0 0 .55.9l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .52-1.34L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.74 1.67l7.22 7.99A2 2 0 0 1 10 14z"/></svg> Filtry<span class="pocet-f" hidden></span></button>
      <button class="btn primary" id="novy" title="Nový bug (n)">+ Nový</button>
    </div>
    <div class="ja">
      <span class="spojeni" title="Živé spojení"></span>
      <button class="ikona-btn" id="zvonek" title="Oznámení" aria-label="Oznámení"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg><span class="odznak" hidden></span></button>
      <button class="ikona-btn" id="ozubene" title="Nastavení" aria-label="Nastavení"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <b id="mojeJmeno" title="Nastavení"></b>
      <button class="btn" id="odhlasit">Odhlásit</button>
    </div>
    <nav class="taby"></nav>
  </header>

<datalist id="projekty"></datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
'use strict';

// Ikony tabů a sloupců: obrysy cest ve stylu Lucide (24×24), barva z currentColor.
const IKONY_SVG = {
  prehled:   '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  nahlaseno: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  resi_se:   '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  vyreseno:  '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  ukoly:     '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
};
function ikona(klic) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  for (const [k, v] of Object.entries({ viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': 2,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true', class: 'ik-svg' })) s.setAttribute(k, v);
  s.innerHTML = IKONY_SVG[klic];
  return s;
}

const SLOUPCE = [
  { stav: 'nahlaseno', nazev: 'Nahlášené' },
  { stav: 'resi_se',   nazev: 'Řeší se' },
  { stav: 'vyreseno',  nazev: 'Vyřešené' },
];
// Tab Úkoly je vlastní přehled (kanban) jen s úkoly — ostatní taby se řídí filtrem typu,
// který je ve výchozím stavu „Jen bugy".
const TABY = [{ id: 'prehled', nazev: 'Přehled' }, ...SLOUPCE.map(s => ({ id: s.stav, nazev: s.nazev })),
  { id: 'ukoly', nazev: 'Úkoly' }];
const PRIORITY = { 1: '🔴 Vysoká', 2: '🟠 Střední', 3: '⚪ Nízká' };
const TYPY = { bug: '🐞 Bug', ukol: '📋 Úkol' };
const IKONA = { bug: '🐞', ukol: '📋' };
const ZAKLADNI_PROJEKTY = ['Čundr', 'DOKUL', 'Atlas', 'Moje Hra'];
const VYCHOZI_PROJEKT = 'Čundr';
// Vrstvy aplikace Čundr (jako v jejím bočním menu). Jen pro projekt Čundr.
const VRSTVY = [['planovani', '🗺 Plánování tras'], ['cundrovani', '🥾 Čundrování'], ['komunita', '👥 Komunita']];
const NAZEV_VRSTVY = Object.fromEntries(VRSTVY);
const PROJEKT_S_VRSTVAMI = 'Čundr';
const NIKDO = '-';  // hodnota filtru „Řeší: nikdo"
const VYCHOZI_NAZEV = 'Nový bug';
const VYRESENYCH_NAHLED = 30; // víc se ve sloupci Vyřešené ukáže až na klik

if (!window.BUGNIK) {
  document.body.textContent = 'Chybí config.js — zkopíruj config.example.js jako config.js a doplň údaje ze Supabase.';
  throw new Error('chybí config.js');
}
const sb = supabase.createClient(BUGNIK.url, BUGNIK.anonKey);
const $ = (s, el = document) => el.querySelector(s);
$('#fVrstva').append(...[...VRSTVY, [NIKDO, 'Vrstva neurčená']].map(([v, t]) => new Option(t, v)));

let ja = null;                 // uuid přihlášeného
let mujEmail = '';
let ja_radek = null;           // můj řádek z `lide` (precteno_do, nastaveni)
let udalosti = [];             // oznámení, nejnovější první
const POCET_UDALOSTI = 100;
const bugy = new Map();        // id → řádek
const lide = new Map();        // id → jméno
let vsechnyVyresene = false;
let otevreny = null;           // id bugu v detailu, nebo 'novy' pro rozepsaný nový
let koncept = null;            // rozepsaný nový bug (ještě není v databázi)
let tab = 'prehled';
const razeni = {};             // tab → { klic, smer }

// ── Pomocníci ─────────────────────────────────────────────
function el(tag, attrs = {}, ...deti) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'text') e.textContent = v;
    else if (k in e && k !== 'list') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const d of deti.flat()) if (d != null) e.append(d);
  return e;
}
const jmeno = id => (id && lide.get(id)) || '—';
function datum(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const dnes = new Date();
  const opt = d.getFullYear() === dnes.getFullYear()
    ? { day: 'numeric', month: 'numeric' } : { day: 'numeric', month: 'numeric', year: 'numeric' };
  return d.toLocaleDateString('cs-CZ', opt);
}
function chyba(e) {
  console.error(e);
  alert('Něco se nepovedlo: ' + (e.message || e));
}
async function dotaz(p) {
  const { data, error } = await p;
  if (error) throw error;
  return data;
}
// Je na bugu něco, o co by byla škoda přijít? Jen pak se ptáme před smazáním.
function maObsah(b) {
  const nazev = (b.nazev || '').trim();
  return b.screenshoty?.length > 0 || !!(b.popis || '').trim() || (!!nazev && nazev !== VYCHOZI_NAZEV);
}

const VYCHOZI_TYP = 'bug';
const KLIC_FILTRU = 'bugnik-filtry3'; // nový klíč → u všech se jednou nastaví výchozí Čundr + Jen bugy
function ulozFiltry() {
  try {
    localStorage.setItem(KLIC_FILTRU, JSON.stringify({
      p: $('#fProjekt').value, t: $('#fTyp').value, r: $('#fPriorita').value,
      v: $('#fVrstva').value, re: $('#fResi').value, n: $('#fNahlasil').value,
    }));
  } catch {}
}
function nactiFiltry() {
  try {
    const ulozene = localStorage.getItem(KLIC_FILTRU);
    if (!ulozene) { $('#fTyp').value = VYCHOZI_TYP; return VYCHOZI_PROJEKT; }
    const f = JSON.parse(ulozene);
    $('#fTyp').value = f.t ?? VYCHOZI_TYP;
    $('#fPriorita').value = f.r || '';
    $('#fVrstva').value = f.v || '';
    // Osoby se do nabídek doplní až po načtení lidí — hodnotu si zatím schovat.
    $('#fResi').dataset.chci = f.re || '';
    $('#fNahlasil').dataset.chci = f.n || '';
    return f.p ?? VYCHOZI_PROJEKT;
  } catch { $('#fTyp').value = VYCHOZI_TYP; return VYCHOZI_PROJEKT; }
}

// ── Přihlášení ────────────────────────────────────────────
$('#login form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.target;
  $('.chyba', f).textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: f.email.value, password: f.heslo.value });
  if (error) $('.chyba', f).textContent = 'Špatný e-mail nebo heslo.';
});
$('#odhlasit').addEventListener('click', () => sb.auth.signOut());

let spusteno = false;
sb.auth.onAuthStateChange((_ev, session) => {
  const prihlasen = !!session;
  $('#login').hidden = prihlasen;
  $('#app').hidden = !prihlasen;
  if (prihlasen && !spusteno) { spusteno = true; ja = session.user.id; mujEmail = session.user.email; start().catch(chyba); }
  if (!prihlasen && spusteno) location.reload();
});

// ── Start: načíst data a odebírat změny ───────────────────
async function start() {
  const [l, b, u] = await Promise.all([
    dotaz(sb.from('lide').select('id, jmeno, precteno_do, nastaveni')),
    dotaz(sb.from('bugs').select('*')),
    dotaz(sb.from('udalosti').select('*').order('created_at', { ascending: false }).limit(POCET_UDALOSTI)),
  ]);
  l.forEach(r => lide.set(r.id, r.jmeno));
  ja_radek = l.find(r => r.id === ja) || { precteno_do: new Date().toISOString(), nastaveni: {} };
  b.forEach(r => bugy.set(r.id, r));
  udalosti = u;
  $('#mojeJmeno').textContent = jmeno(ja);
  obnovProjekty(nactiFiltry());
  obnovOsoby();
  tab = tabZOdkazu();
  vykresli();
  obnovZvonek();
  otevriZOdkazu();

  sb.channel('bugnik')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'bugs' }, zmena => {
      if (zmena.eventType === 'DELETE') {
        bugy.delete(zmena.old.id);
        if (otevreny === zmena.old.id) dlg.close();
        vykresli();
        return;
      }
      const r = zmena.new;
      const cizi = r.upravil && r.upravil !== ja;
      bugy.set(r.id, r);
      if (cizi && otevreny === r.id) vyplnDetail(r, true);
      obnovProjekty();
      vykresli();
      if (cizi) blikni(r.id);
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'udalosti' }, zmena => {
      novaUdalost(zmena.new);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'lide' }, zmena => {
      if (zmena.new?.id) lide.set(zmena.new.id, zmena.new.jmeno);
      if (zmena.new?.id === ja) {
        ja_radek = zmena.new;
        if ($('#nastaveni').open) vykresliTelegram(); // propojení Telegramu dokončí bot
      }
      $('#mojeJmeno').textContent = jmeno(ja);
      obnovOsoby();
      vykresli();
    })
    .subscribe(stav => {
      $('.spojeni').classList.toggle('ok', stav === 'SUBSCRIBED');
      $('.spojeni').title = stav === 'SUBSCRIBED' ? 'Živé spojení — změny se propisují hned' : 'Spojení se navazuje…';
      // Po výpadku spojení (uspaný notebook) dotáhnout, co se mezitím změnilo.
      if (stav === 'SUBSCRIBED' && bugy.size) { prenacti(); prenactiUdalosti(); }
    });
}

async function prenacti() {
  const b = await dotaz(sb.from('bugs').select('*'));
  bugy.clear();
  b.forEach(r => bugy.set(r.id, r));
  obnovProjekty();
  vykresli();
}

function blikni(id) {
  const k = document.querySelector(`[data-id="${id}"]`);
  if (!k) return;
  k.classList.add('blik');
  setTimeout(() => k.classList.remove('blik'), 900);
}

function obnovProjekty(vybrat) {
  const vse = new Set(ZAKLADNI_PROJEKTY);
  for (const b of bugy.values()) if (b.projekt) vse.add(b.projekt);
  const serazene = [...vse].sort((a, b) => a.localeCompare(b, 'cs'));
  const sel = $('#fProjekt');
  const aktualni = vybrat ?? sel.value;
  sel.replaceChildren(el('option', { value: '', text: 'Všechny projekty' }),
    ...serazene.map(p => el('option', { value: p, text: p })));
  sel.value = serazene.includes(aktualni) ? aktualni : '';
  $('#projekty').replaceChildren(...serazene.map(p => el('option', { value: p })));
}

// Nabídky filtrů Řeší / Nahlásil: lidé z `lide`, u Řeší navíc „nikdo".
function obnovOsoby() {
  const osoby = [...lide].sort((a, b) => a[1].localeCompare(b[1], 'cs'));
  for (const [id, prvni, nikdo] of [['#fResi', 'Řeší kdokoli', 'Nikdo neřeší'], ['#fNahlasil', 'Nahlásil kdokoli']]) {
    const sel = $(id);
    const chci = sel.dataset.chci ?? sel.value;
    delete sel.dataset.chci;
    sel.replaceChildren(el('option', { value: '', text: prvni }),
      nikdo ? el('option', { value: NIKDO, text: nikdo }) : null,
      ...osoby.map(([v, j]) => el('option', { value: v, text: (id === '#fResi' ? 'Řeší: ' : 'Nahlásil: ') + j })));
    sel.value = [...sel.options].some(o => o.value === chci) ? chci : '';
  }
}

// ── Taby ──────────────────────────────────────────────────
function tabZOdkazu() {
  const h = location.hash.slice(1);
  if (TABY.some(t => t.id === h)) return h;
  try { return localStorage.getItem('bugnik-tab') || 'prehled'; } catch { return 'prehled'; }
}
function prepniTab(id) {
  tab = id;
  try { localStorage.setItem('bugnik-tab', id); } catch {}
  history.replaceState(null, '', id === 'prehled' ? location.pathname : '#' + id);
  vykresli();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => {
  if (!spusteno || otevriZOdkazu()) return;
  tab = tabZOdkazu();
  vykresli();
});
// Odkaz #bug-12 (ze zprávy na Telegramu / v e-mailu) otevře rovnou detail.
function otevriZOdkazu() {
  const m = location.hash.match(/^#bug-(\d+)$/);
  if (!m) return false;
  history.replaceState(null, '', tab === 'prehled' ? location.pathname : '#' + tab);
  const id = Number(m[1]);
  if (bugy.has(id)) otevriDetail(id);
  else alert(`Záznam #${id} už neexistuje.`);
  return true;
}

function vykresliTaby() {
  const p = $('#fProjekt').value;
  $('#fVrstva').parentElement.hidden = !!p && p !== PROJEKT_S_VRSTVAMI;   // před počty — filtr vrstvy platí jen viditelný
  const pocty = {};
  for (const b of bugy.values()) if (prosloFiltrem(b, $('#fTyp').value)) pocty[b.stav] = (pocty[b.stav] || 0) + 1;
  // U Úkolů jen nevyřešené — kolik jich ještě zbývá.
  pocty.ukoly = [...bugy.values()].filter(b => b.stav !== 'vyreseno' && prosloFiltrem(b, 'ukol')).length;
  $('#fTyp').parentElement.hidden = tab === 'ukoly';
  ukazPocetFiltru();
  $('nav.taby').replaceChildren(...TABY.map(t => el('button', {
    type: 'button', class: t.id === tab ? 'aktivni' : null, onclick: () => prepniTab(t.id),
  }, ikona(t.id), t.nazev, t.id !== 'prehled' ? el('span', { class: 'n', text: ` (${pocty[t.id] || 0})` }) : null)));
}

// ── Filtry ────────────────────────────────────────────────
// Typ, podle kterého se teď filtruje: v tabu Úkoly vždy úkoly, jinak podle výběru v liště.
const typFiltru = () => tab === 'ukoly' ? 'ukol' : $('#fTyp').value;

function prosloFiltrem(b, t = typFiltru()) {
  const p = $('#fProjekt').value, r = $('#fPriorita').value;
  if (p && b.projekt !== p) return false;
  if (t && (b.typ || 'bug') !== t) return false;
  if (r && String(b.priorita) !== r) return false;
  const v = $('#fVrstva').value, re = $('#fResi').value, n = $('#fNahlasil').value;
  if (v && !$('#fVrstva').parentElement.hidden && (b.vrstva || '') !== (v === NIKDO ? '' : v)) return false;
  if (re && (re === NIKDO ? !!b.resi : b.resi !== re)) return false;
  if (n && b.nahlasil !== n) return false;
  const q = $('#hledat').value.trim().toLowerCase();
  if (q) {
    const text = [b.nazev, b.popis, b.reseni, b.projekt, NAZEV_VRSTVY[b.vrstva], '#' + b.id].join(' ').toLowerCase();
    if (!q.split(/\s+/).every(s => text.includes(s))) return false;
  }
  return true;
}

function vykresli() {
  vykresliTaby();
  if (tab === 'prehled' || tab === 'ukoly') vykresliKanban();
  else vykresliTabulku(tab);
}

// ── Přehled (kanban) ──────────────────────────────────────
function serad(stav) {
  const v = [...bugy.values()].filter(b => b.stav === stav);
  // Vyřešené: nejčerstvější nahoře; ostatní podle ručního pořadí.
  if (stav === 'vyreseno') return v.sort((a, b) => (b.vyreseno_at || '').localeCompare(a.vyreseno_at || ''));
  return v.sort((a, b) => a.poradi - b.poradi || b.id - a.id);
}

function vykresliKanban() {
  const main = $('main');
  const scroll = [...main.querySelectorAll('.karty')].map(k => k.scrollTop);
  main.className = 'kanban';
  main.replaceChildren(...SLOUPCE.map(s => sloupec(s)));
  main.querySelectorAll('.karty').forEach((k, i) => { k.scrollTop = scroll[i] || 0; });
}

function sloupec({ stav, nazev }) {
  const vse = serad(stav);
  let viditelne = vse.filter(b => prosloFiltrem(b));
  const skryto = stav === 'vyreseno' && !vsechnyVyresene ? Math.max(0, viditelne.length - VYRESENYCH_NAHLED) : 0;
  if (skryto) viditelne = viditelne.slice(0, VYRESENYCH_NAHLED);

  const karty = el('div', { class: 'karty' }, viditelne.map(karta));
  const s = el('section', { class: 'sloupec', 'data-stav': stav },
    el('h2', {}, el('span', { class: 'hl' }, ikona(stav), nazev), el('span', { class: 'pocet', text: viditelne.length + skryto })),
    stav === 'nahlaseno' ? rychlePridani() : null,
    karty,
    skryto ? el('button', { class: 'dalsi', text: `Zobrazit dalších ${skryto}`,
      onclick: () => { vsechnyVyresene = true; vykresli(); } }) : null,
  );
  napojDrop(s, karty, stav);
  return s;
}

function rychlePridani() {
  return el('form', { class: 'rychly', onsubmit: async ev => {
    ev.preventDefault();
    const inp = ev.target.elements[0];
    const nazev = inp.value.trim();
    if (!nazev) return;
    inp.value = '';
    try { await zalozBug({ nazev, typ: typFiltru() || 'bug' }); } catch (e) { inp.value = nazev; chyba(e); }
  } }, el('input', { placeholder: typFiltru() === 'ukol' ? '+ Rychle zapsat úkol a Enter' : '+ Rychle zapsat bug a Enter', maxlength: 200 }));
}

function karta(b) {
  const i = SLOUPCE.findIndex(s => s.stav === b.stav);
  const posun = (smer, ev) => { ev.stopPropagation(); presun(b.id, SLOUPCE[i + smer].stav); };
  return el('article', {
    class: 'karta', 'data-id': b.id, 'data-p': b.priorita, draggable: true,
    onclick: () => otevriDetail(b.id),
    ondragstart: ev => { ev.dataTransfer.setData('text/plain', b.id); ev.currentTarget.classList.add('tahnu'); },
    ondragend: ev => ev.currentTarget.classList.remove('tahnu'),
  },
    el('div', { class: 'nazev', text: `${IKONA[b.typ] || IKONA.bug} ${b.nazev}` }),
    el('div', { class: 'meta' },
      b.projekt ? el('span', { class: 'tag', text: b.projekt }) : null,
      NAZEV_VRSTVY[b.vrstva] ? el('span', { class: 'tag vrstva', text: NAZEV_VRSTVY[b.vrstva] }) : null,
      el('span', { text: '#' + b.id }),
      b.resi ? el('span', { text: '🔧 ' + jmeno(b.resi) }) : el('span', { text: '✍ ' + jmeno(b.nahlasil) }),
      b.screenshoty?.length ? el('span', { text: '🖼 ' + b.screenshoty.length, title: 'Screenshoty' }) : null,
      el('span', { text: datum(b.stav === 'vyreseno' && b.vyreseno_at ? b.vyreseno_at : b.created_at) }),
      el('span', { class: 'sipky' },
        i > 0 ? el('button', { type: 'button', text: '←', title: 'Posunout zpět', onclick: ev => posun(-1, ev) }) : null,
        i < SLOUPCE.length - 1 ? el('button', { type: 'button', text: '→', title: 'Posunout dál', onclick: ev => posun(1, ev) }) : null,
      ),
    ),
  );
}

// ── Přetahování ───────────────────────────────────────────
function napojDrop(sloupecEl, karty, stav) {
  let misto = null;
  const kamPatri = y => [...karty.querySelectorAll('.karta:not(.tahnu)')]
    .find(k => { const r = k.getBoundingClientRect(); return y < r.top + r.height / 2; }) || null;

  sloupecEl.addEventListener('dragover', ev => {
    ev.preventDefault();
    sloupecEl.classList.add('nad');
    if (stav === 'vyreseno') return; // vyřešené se řadí podle data, pořadí nejde měnit
    misto ??= el('div', { class: 'misto' });
    const pred = kamPatri(ev.clientY);
    if (misto.nextSibling !== pred || misto.parentNode !== karty) karty.insertBefore(misto, pred);
  });
  sloupecEl.addEventListener('dragleave', ev => {
    if (sloupecEl.contains(ev.relatedTarget)) return;
    sloupecEl.classList.remove('nad');
    misto?.remove();
  });
  sloupecEl.addEventListener('drop', ev => {
    ev.preventDefault();
    sloupecEl.classList.remove('nad');
    const id = Number(ev.dataTransfer.getData('text/plain'));
    if (!id) return;
    const pred = misto?.nextElementSibling?.classList.contains('karta') ? misto.nextElementSibling : null;
    const za = misto?.previousElementSibling?.classList.contains('karta') ? misto.previousElementSibling : null;
    misto?.remove();
    misto = null;
    const p = id2 => bugy.get(Number(id2?.dataset.id))?.poradi;
    let poradi;
    if (stav === 'vyreseno') poradi = undefined;
    else if (za && pred) poradi = (p(za) + p(pred)) / 2;
    else if (pred) poradi = p(pred) - 1;
    else if (za) poradi = p(za) + 1;
    presun(id, stav, poradi);
  });
}

// ── Tabulka (taby se stavem) ──────────────────────────────
const SLOUPCE_TABULKY = [
  { klic: 'typ',      nazev: 'Typ',      hodnota: b => b.typ || 'bug' },
  { klic: 'id',       nazev: '#',        hodnota: b => b.id },
  { klic: 'nazev',    nazev: 'Název',    hodnota: b => b.nazev.toLowerCase() },
  { klic: 'projekt',  nazev: 'Projekt',  hodnota: b => b.projekt.toLowerCase() },
  { klic: 'priorita', nazev: 'Priorita', hodnota: b => b.priorita },
  { klic: 'nahlasil', nazev: 'Nahlásil', hodnota: b => jmeno(b.nahlasil).toLowerCase() },
  { klic: 'resi',     nazev: 'Řeší',     hodnota: b => b.resi ? jmeno(b.resi).toLowerCase() : '￿' },
  { klic: 'created_at', nazev: 'Nahlášeno', hodnota: b => b.created_at },
  { klic: 'vyreseno_at', nazev: 'Vyřešeno', hodnota: b => b.vyreseno_at || '', jen: 'vyreseno' },
  { klic: 'obr',      nazev: 'Obrázky',  hodnota: b => b.screenshoty.length },
];

function vychoziRazeni(stav) {
  return stav === 'vyreseno' ? { klic: 'vyreseno_at', smer: -1 } : { klic: 'priorita', smer: 1 };
}

function vykresliTabulku(stav) {
  const main = $('main');
  main.className = 'tabulka';
  const r = razeni[stav] ||= vychoziRazeni(stav);
  const sl = SLOUPCE_TABULKY.find(s => s.klic === r.klic);
  const radky = [...bugy.values()].filter(b => b.stav === stav && prosloFiltrem(b)).sort((a, b) => {
    const x = sl.hodnota(a), y = sl.hodnota(b);
    // Při shodě: novější nahoře.
    return (x < y ? -1 : x > y ? 1 : 0) * r.smer || b.created_at.localeCompare(a.created_at);
  });

  if (!radky.length) {
    main.replaceChildren(el('div', { class: 'prazdno', text: 'Nic tu není (zkontroluj filtry nahoře).' }));
    return;
  }

  const sloupce = SLOUPCE_TABULKY.filter(s => !s.jen || s.jen === stav);
  const razeniKlik = klic => {
    razeni[stav] = r.klic === klic ? { klic, smer: -r.smer } : { klic, smer: klic.endsWith('_at') ? -1 : 1 };
    vykresli();
  };
  main.replaceChildren(el('table', {},
    el('thead', {}, el('tr', {}, el('th', { class: 'pruh' }),
      sloupce.map(s => el('th', { onclick: () => razeniKlik(s.klic) }, s.nazev,
        r.klic === s.klic ? el('span', { class: 'smer', text: r.smer > 0 ? ' ▲' : ' ▼' }) : null)))),
    el('tbody', {}, radky.map(b => radekTabulky(b, stav))),
  ));
  nactiNahledy(radky.flatMap(b => b.screenshoty));
}

function radekTabulky(b, stav) {
  const bunky = {
    typ: el('td', { class: 'typ', title: TYPY[b.typ || 'bug'], text: IKONA[b.typ] || IKONA.bug }),
    id: el('td', { class: 'maly cislo', text: '#' + b.id }),
    nazev: el('td', { class: 'hlavni' },
      el('div', { class: 'nazev', text: `${window.innerWidth <= 800 ? (IKONA[b.typ] || IKONA.bug) + ' ' : ''}${b.nazev}` }),
      b.popis ? el('div', { class: 'popis', text: b.popis }) : null,
      stav !== 'nahlaseno' && b.reseni ? el('div', { class: 'reseni', text: '✓ ' + b.reseni }) : null),
    projekt: el('td', { class: 'maly', 'data-label': 'Projekt' },
      b.projekt ? el('span', { class: 'tag', text: b.projekt }) : '—',
      NAZEV_VRSTVY[b.vrstva] ? el('div', { text: NAZEV_VRSTVY[b.vrstva] }) : null),
    priorita: el('td', { class: 'maly', 'data-label': 'Priorita', text: PRIORITY[b.priorita] }),
    nahlasil: el('td', { class: 'maly', 'data-label': 'Nahlásil', text: jmeno(b.nahlasil) }),
    resi: el('td', { class: 'maly', 'data-label': 'Řeší', text: jmeno(b.resi) }),
    created_at: el('td', { class: 'maly', 'data-label': 'Nahlášeno', text: datum(b.created_at) }),
    vyreseno_at: el('td', { class: 'maly', 'data-label': 'Vyřešeno', text: datum(b.vyreseno_at) }),
    obr: el('td', { class: 'obr' }, b.screenshoty.length ? el('div', { class: 'nahledy' },
      b.screenshoty.map(c => el('img', { alt: '', 'data-cesta': c, loading: 'lazy', src: odkaz(c) || null,
        onclick: ev => { ev.stopPropagation(); ukaz(odkaz(c)); } }))) : null),
  };
  return el('tr', { 'data-id': b.id, 'data-p': b.priorita, onclick: () => otevriDetail(b.id) },
    el('td', { class: 'pruh' }),
    SLOUPCE_TABULKY.filter(s => !s.jen || s.jen === stav).map(s => bunky[s.klic]));
}

// ── Zápis do databáze ─────────────────────────────────────
function nahoru(stav) {
  const v = [...bugy.values()].filter(b => b.stav === stav).map(b => b.poradi);
  return v.length ? Math.min(...v) - 1 : 0;
}

async function zalozBug(pole) {
  const r = await dotaz(sb.from('bugs').insert({
    priorita: 2, projekt: $('#fProjekt').value, ...pole, stav: 'nahlaseno', poradi: nahoru('nahlaseno'),
  }).select().single());
  bugy.set(r.id, r);
  obnovProjekty();
  vykresli();
  return r;
}

async function uloz(id, zmeny) {
  const b = bugy.get(id);
  const puvodni = { ...b };
  Object.assign(b, zmeny);  // hned ukázat, databáze to potvrdí
  vykresli();
  try {
    const r = await dotaz(sb.from('bugs').update(zmeny).eq('id', id).select().single());
    bugy.set(id, r);
    vykresli();
    return r;
  } catch (e) {
    bugy.set(id, puvodni);
    vykresli();
    throw e;
  }
}

function presun(id, stav, poradi) {
  const b = bugy.get(id);
  if (!b) return;
  const zmeny = { stav };
  if (poradi !== undefined) zmeny.poradi = poradi;
  else if (b.stav !== stav) zmeny.poradi = nahoru(stav);
  if (stav === 'resi_se' && !b.resi) zmeny.resi = ja;   // kdo to vzal, ten to řeší
  if (b.stav === stav && zmeny.poradi === undefined) return;
  uloz(id, zmeny).catch(chyba);
}

// ── Detail a nový bug ─────────────────────────────────────
const dlg = $('#detail');
const formular = dlg.firstElementChild;
dlg.addEventListener('close', () => {
  // Zavřený nepřidaný koncept: jeho už nahrané obrázky by jinak zůstaly viset v úložišti.
  // (Až sem, ne do zavri() — Chrome občas zavře okno na Esc i přes preventDefault.)
  if (koncept?.screenshoty.length) sb.storage.from('screenshoty').remove(koncept.screenshoty);
  otevreny = null;
  koncept = null;
});
// Esc, klik vedle okna i „Zrušit" jdou přes zavri() — u rozepsaného nového se zeptá.
dlg.addEventListener('cancel', ev => { ev.preventDefault(); zavri(); });
dlg.addEventListener('click', ev => { if (ev.target === dlg) zavri(); });
formular.addEventListener('submit', ev => { ev.preventDefault(); otevreny === 'novy' ? pridejKoncept() : dlg.close(); });
formular.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); formular.requestSubmit(); }
  // Název je textarea kvůli zalamování, ale nový řádek v něm nechceme: Enter u nového = Přidat.
  else if (ev.key === 'Enter' && ev.target.name === 'nazev') {
    ev.preventDefault();
    if (otevreny === 'novy') formular.requestSubmit();
  }
  // Enter v jednořádkovém poli nemá odeslat formulář (zavřít okno) — jen u nového ano, to je „Přidat".
  else if (ev.key === 'Enter' && ev.target.tagName === 'INPUT' && ev.target.type !== 'radio' && otevreny !== 'novy') ev.preventDefault();
});

function zavri() {
  if (otevreny === 'novy' && koncept) {
    if (maObsah(koncept) && !confirm('Zahodit rozepsaný bug?')) return;
  }
  dlg.close();
}

function otevriDetail(id) {
  otevreny = id;
  vyplnDetail(bugy.get(id));
  dlg.showModal();
  vyskaVsech();          // výška jde změřit až u zobrazeného okna
  formular.scrollTop = 0;
  document.activeElement?.blur();  // showModal dá fokus do názvu a ten by vypadal rozepsaně
}

function otevriNovy(soubory = []) {
  koncept = {
    typ: typFiltru() || 'bug', nazev: '', popis: '', projekt: $('#fProjekt').value || VYCHOZI_PROJEKT,
    priorita: 2, screenshoty: [],
  };
  otevreny = 'novy';
  vyplnNovy();
  dlg.showModal();
  vyskaVsech();
  formular.elements.nazev.focus();
  if (soubory.length) nahraj(soubory);
}

async function pridejKoncept() {
  const k = koncept;
  if (!k.nazev.trim()) {
    if (!k.popis.trim()) { formular.elements.nazev.focus(); return; }
    k.nazev = k.popis.trim().split('\n')[0].slice(0, 120); // bez názvu → první řádek popisu
  }
  const tlacitko = $('.primary', formular);
  tlacitko.disabled = true;
  try {
    const { screenshoty, vrstva, ...pole } = k;
    if (vrstva && pole.projekt.trim() === PROJEKT_S_VRSTVAMI) pole.vrstva = vrstva;
    await zalozBug({ ...pole, nazev: k.nazev.trim(), screenshoty });
    koncept = null;   // obrázky už patří bugu, zavření je nesmí smazat
    dlg.close();
  } catch (e) { tlacitko.disabled = false; chyba(e); }
}

// ── Ovládání okna: přepínače místo rozbalovacích nabídek ──
// Přepínač = skupina radio tlačítek; f.elements[jmeno].value funguje stejně jako u <select>.
function prepinac(jmenoPole, moznosti, hodnota, onchange) {
  return el('div', { class: 'seg', role: 'radiogroup' }, moznosti.map(([v, text, trida]) =>
    el('label', { class: 'seg-v' + (trida ? ' ' + trida : '') },
      el('input', { type: 'radio', name: jmenoPole, value: v, checked: String(v) === String(hodnota ?? ''), onchange }),
      el('span', { text }))));
}
const pole = (popisek, ovladac, trida) => el('div', { class: 'pole' + (trida ? ' ' + trida : '') },
  el('span', { class: 'popisek', text: popisek }), ovladac);

const prepinacTypu = (h, on) => pole('Typ', prepinac('typ', [['bug', '🐞 Bug'], ['ukol', '📋 Úkol']], h, on), 'm-ovl');
const prepinacPriority = (h, on) => pole('Priorita', prepinac('priorita',
  [[1, '🔴 Vysoká', 'p-1'], [2, '🟠 Střední', 'p-2'], [3, '⚪ Nízká', 'p-3']], h, on), 'm-ovl');
const prepinacStavu = (h, on) => pole('Stav', prepinac('stav',
  SLOUPCE.map(s => [s.stav, s.nazev, 's-' + s.stav]), h, on), 'm-ovl');
const poleProjektu = (h, on) => el('label', { class: 'pole m-ovl' }, el('span', { class: 'popisek', text: 'Projekt' }),
  el('input', { name: 'projekt', list: 'projekty', value: h, oninput: on }));

// Vrstva jen u Čundru; při přepsání projektu se pole schová/ukáže.
const poleVrstvy = (projekt, h, on) => el('div', { class: 'pole m-ovl pole-vrstva', hidden: projekt.trim() !== PROJEKT_S_VRSTVAMI },
  el('span', { class: 'popisek', text: 'Vrstva v aplikaci' }),
  prepinac('vrstva', [['', 'neurčeno'], ...VRSTVY], h || '', on));
const ukazVrstvu = projekt => { const p = $('.pole-vrstva', formular); if (p) p.hidden = projekt.trim() !== PROJEKT_S_VRSTVAMI; };

// Textová pole rostou s obsahem — dlouhý popis je vidět celý, bez posuvníku.
function autoVyska(t) {
  if (!t) return;
  t.style.height = 'auto';
  t.style.height = t.scrollHeight + 2 + 'px';
}
const vyskaVsech = () => formular.querySelectorAll('textarea').forEach(autoVyska);
formular.addEventListener('input', ev => { if (ev.target.tagName === 'TEXTAREA') autoVyska(ev.target); });

const poleNazvu = (hodnota, on, placeholder) => el('textarea', {
  class: 'nazev-in m-nazev', name: 'nazev', rows: 1, maxlength: 200, value: hodnota, placeholder, oninput: on });
const polePopisu = (hodnota, on) => el('label', { class: 'pole m-popis' },
  el('span', { class: 'popisek', text: 'Popis — co se stalo, jak to zopakovat' }),
  el('textarea', { class: 'popis-in', name: 'popis', value: hodnota, oninput: on }));
const poleObrazku = () => el('div', { class: 'pole m-obr' },
  el('span', { class: 'popisek', text: 'Screenshoty — Ctrl+V, přetáhnout sem, nebo kliknout' }),
  el('div', { class: 'obrazky' }));

function vyplnNovy() {
  const k = koncept;
  const nastav = p => ev => {
    k[p] = p === 'priorita' ? Number(ev.target.value) : ev.target.value;
    if (p === 'projekt') ukazVrstvu(k.projekt);
  };
  formular.replaceChildren(
    el('div', { class: 'levy' },
      el('div', { class: 'id-radek m-hl', text: 'Nový záznam' }),
      poleNazvu('', nastav('nazev'), 'Co se děje? (název)'),
      polePopisu('', nastav('popis')),
      poleObrazku()),
    el('aside', { class: 'bok' },
      prepinacTypu(k.typ, nastav('typ')),
      prepinacPriority(k.priorita, nastav('priorita')),
      poleProjektu(k.projekt, nastav('projekt')),
      poleVrstvy(k.projekt, '', nastav('vrstva')),
      el('div', { class: 'info m-info', text: 'Zapíše se do Nahlášených. Ctrl+Enter = přidat.' }),
      el('div', { class: 'akce m-akce' },
        el('button', { type: 'button', class: 'btn', text: 'Zrušit', onclick: zavri }),
        el('button', { class: 'btn primary', text: 'Přidat' }))),
  );
  vykresliObrazky(k.screenshoty);
}

function vyplnDetail(b, zvenku = false) {
  const f = formular;
  // Ten druhý upravil bug, který mám otevřený: přepsat jen pole, ve kterých zrovna nepíšu.
  if (zvenku) {
    for (const k of ['typ', 'nazev', 'popis', 'reseni', 'projekt', 'vrstva', 'priorita', 'stav', 'resi']) {
      const p = f.elements[k];
      if (p && p !== document.activeElement) p.value = b[k] ?? '';
    }
    ukazReseni(b);
    ukazVrstvu(b.projekt);
    vyskaVsech();
    vykresliObrazky(b.screenshoty);
    $('.kdy', f).replaceChildren(...popisKdy(b));
    $('.id-radek', f).textContent = idRadek(b);
    return;
  }
  // Hodnota se bere hned při psaní (ne až po odpočtu) a každé pole má vlastní
  // odpočet — jinak by rychlé přepnutí na jiný bug nebo jiné pole změnu ztratilo
  // nebo ji uložilo ke špatnému bugu.
  const casovace = {};
  const stavUlozeni = el('span', { class: 'ulozeno' });
  const zmena = (p, okamzite) => ev => {
    let v = ev.target.value;
    if (p === 'priorita') v = Number(v);
    if (p === 'resi') v = v || null;
    if (p === 'stav') ukazReseni({ ...bugy.get(b.id), stav: v });
    if (p === 'projekt') ukazVrstvu(v);
    clearTimeout(casovace[p]);
    stavUlozeni.textContent = '';
    casovace[p] = setTimeout(async () => {
      if (p === 'nazev' && !v.trim()) return;
      try {
        const zmeny = { [p]: v };
        if (p === 'stav') {
          zmeny.poradi = nahoru(v);
          if (v === 'resi_se' && !bugy.get(b.id).resi) zmeny.resi = ja;
        }
        const r = await uloz(b.id, zmeny);
        if (otevreny === b.id) {
          if (zmeny.resi) f.elements.resi.value = r.resi;
          $('.id-radek', f).textContent = idRadek(r);
          $('.kdy', f).replaceChildren(...popisKdy(r));
        }
        stavUlozeni.textContent = 'Uloženo ✓';
      } catch (e) { chyba(e); }
    }, okamzite ? 0 : 600);
  };

  f.replaceChildren(
    el('div', { class: 'levy' },
      el('div', { class: 'id-radek m-hl', text: idRadek(b) }),
      poleNazvu(b.nazev, zmena('nazev')),
      polePopisu(b.popis, zmena('popis')),
      el('label', { class: 'pole pole-reseni m-res' },
        el('span', { class: 'popisek', text: 'Řešení — jak se to opravilo, commit' }),
        el('textarea', { class: 'reseni-in', name: 'reseni', value: b.reseni, oninput: zmena('reseni') })),
      poleObrazku()),
    el('aside', { class: 'bok' },
      prepinacStavu(b.stav, zmena('stav', true)),
      prepinacPriority(b.priorita, zmena('priorita', true)),
      prepinacTypu(b.typ || 'bug', zmena('typ', true)),
      poleProjektu(b.projekt, zmena('projekt')),
      poleVrstvy(b.projekt, b.vrstva, zmena('vrstva', true)),
      pole('Řeší', prepinac('resi', [['', 'nikdo'], ...[...lide].map(([id, j]) => [id, j])], b.resi, zmena('resi', true)), 'm-ovl'),
      el('div', { class: 'info m-info' }, el('div', { class: 'kdy' }, ...popisKdy(b)), stavUlozeni),
      el('div', { class: 'akce m-akce' },
        el('button', { type: 'button', class: 'btn danger', text: 'Smazat', onclick: () => smaz(b.id) }),
        el('button', { class: 'btn primary', text: 'Hotovo' }))),
  );
  ukazReseni(b);
  vykresliObrazky(b.screenshoty);
}

const idRadek = b => `${IKONA[b.typ] || IKONA.bug} ${b.typ === 'ukol' ? 'Úkol' : 'Bug'} #${b.id}`;

// Řešení dává smysl až u rozdělaných a hotových; v Nahlášených jen když už tam něco je.
function ukazReseni(b) {
  const pole = $('.pole-reseni', formular);
  if (pole) pole.hidden = b.stav === 'nahlaseno' && !(b.reseni || '').trim();
}

function popisKdy(b) {
  const radek = (k, v) => el('div', {}, k + ' ', el('b', { text: v }));
  return [radek('Nahlásil', jmeno(b.nahlasil)), radek('Založeno', datum(b.created_at)),
    b.vyreseno_at ? radek('Vyřešeno', datum(b.vyreseno_at)) : null].filter(Boolean);
}

async function smaz(id) {
  const b = bugy.get(id);
  if (maObsah(b) && !confirm('Opravdu smazat? Nedá se to vrátit.')) return;
  try {
    await dotaz(sb.from('bugs').delete().eq('id', id));
    if (b.screenshoty.length) await sb.storage.from('screenshoty').remove(b.screenshoty);
    bugy.delete(id);
    dlg.close();
    vykresli();
  } catch (e) { chyba(e); }
}

// ── Screenshoty ───────────────────────────────────────────
const odkazy = new Map(); // cesta → { url, kdy } (podepsaná URL platí hodinu)
const odkaz = c => { const o = odkazy.get(c); return o && Date.now() - o.kdy < 50 * 60e3 ? o.url : null; };

async function nactiOdkazy(cesty) {
  const chybi = [...new Set(cesty)].filter(c => !odkaz(c));
  if (!chybi.length) return;
  const { data } = await sb.storage.from('screenshoty').createSignedUrls(chybi, 3600);
  (data || []).forEach(d => d.signedUrl && odkazy.set(d.path, { url: d.signedUrl, kdy: Date.now() }));
}

async function nactiNahledy(cesty) {
  await nactiOdkazy(cesty);
  document.querySelectorAll('img[data-cesta]').forEach(img => {
    const u = odkaz(img.dataset.cesta);
    if (u && img.src !== u) img.src = u;
  });
}

async function vykresliObrazky(cesty) {
  const box = $('.obrazky', dlg);
  if (!box) return;
  await nactiOdkazy(cesty);
  const vyber = el('input', { type: 'file', accept: 'image/*', multiple: true, hidden: true,
    onchange: ev => nahraj([...ev.target.files]) });
  box.replaceChildren(
    ...cesty.map(c => el('div', { class: 'obrazek' },
      el('img', { src: odkaz(c) || '', alt: '', onclick: () => ukaz(odkaz(c)) }),
      el('button', { type: 'button', text: '✕', title: 'Odebrat', onclick: () => odeber(c) }))),
    el('button', { type: 'button', class: 'vlozit', text: '+ obrázek', onclick: () => vyber.click() }),
    vyber,
  );
}

// Nahraje obrázky do toho, co je zrovna otevřené: existující bug, nebo rozepsaný nový.
async function nahraj(soubory) {
  const obrazky = soubory.filter(s => s.type.startsWith('image/'));
  const cil = otevreny;
  if (!obrazky.length || cil == null) return;
  const box = $('.obrazky', dlg);
  box?.append(el('span', { class: 'vlozit', text: 'Nahrávám…' }));
  try {
    const cesty = [];
    for (const s of obrazky) {
      const pripona = (s.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
      const cesta = `${cil === 'novy' ? 'novy' : cil}/${crypto.randomUUID()}.${pripona}`;
      await dotaz(sb.storage.from('screenshoty').upload(cesta, s, { contentType: s.type }));
      cesty.push(cesta);
    }
    if (cil === 'novy') {
      if (!koncept) { sb.storage.from('screenshoty').remove(cesty); return; } // mezitím zavřeno
      koncept.screenshoty.push(...cesty);
      vykresliObrazky(koncept.screenshoty);
    } else {
      const r = await uloz(cil, { screenshoty: [...bugy.get(cil).screenshoty, ...cesty] });
      if (otevreny === cil) vykresliObrazky(r.screenshoty);
    }
  } catch (e) {
    chyba(e);
    if (otevreny === cil) vykresliObrazky(cil === 'novy' ? koncept?.screenshoty || [] : bugy.get(cil).screenshoty);
  }
}

async function odeber(cesta) {
  const cil = otevreny;
  if (!confirm('Odebrat obrázek?')) return;
  try {
    if (cil === 'novy') {
      koncept.screenshoty = koncept.screenshoty.filter(c => c !== cesta);
      vykresliObrazky(koncept.screenshoty);
    } else {
      const r = await uloz(cil, { screenshoty: bugy.get(cil).screenshoty.filter(c => c !== cesta) });
      vykresliObrazky(r.screenshoty);
    }
    await sb.storage.from('screenshoty').remove([cesta]);
  } catch (e) { chyba(e); }
}

function ukaz(url) {
  if (!url) return;
  $('#nahled img').src = url;
  $('#nahled').showModal();
}
$('#nahled').addEventListener('click', () => $('#nahled').close());

// Obrázky ze schránky: Win+Shift+S je dá do `files`, „Kopírovat obrázek"
// z prohlížeče někdy jen do `items` — bereme obojí.
function obrazkyZeSchranky(data) {
  const z = [...(data?.items || [])]
    .filter(i => i.kind === 'file' && i.type.startsWith('image/'))
    .map(i => i.getAsFile()).filter(Boolean);
  return z.length ? z : [...(data?.files || [])].filter(s => s.type.startsWith('image/'));
}

// Jeden handler pro celou stránku: když je otevřený bug (nebo nový), obrázek
// jde do něj — ať je fokus kdekoli. Jinak se založí nový záznam s obrázkem.
document.addEventListener('paste', ev => {
  if ($('#app').hidden || document.querySelector('#nahled[open], #oznameni[open], #nastaveni[open], #filtry[open]')) return;
  const soubory = obrazkyZeSchranky(ev.clipboardData);
  if (!soubory.length) return;
  ev.preventDefault();
  if (dlg.open) nahraj(soubory);
  else otevriNovy(soubory);
});
dlg.addEventListener('dragover', ev => ev.preventDefault());
dlg.addEventListener('drop', ev => {
  if (!ev.dataTransfer.files.length || otevreny == null) return;
  ev.preventDefault();
  nahraj([...ev.dataTransfer.files]);
});

// ── Lišta ─────────────────────────────────────────────────
// Kolik filtrů z okna Filtry teď platí (skryté — typ v Úkolech, vrstva mimo Čundr — se nepočítají).
function ukazPocetFiltru() {
  const aktivni = [...document.querySelectorAll('#filtry select')].filter(s => s.value && !s.parentElement.hidden);
  const o = $('#filtryBtn .pocet-f');
  o.hidden = !aktivni.length;
  o.textContent = aktivni.length;
  $('#filtryBtn').classList.toggle('aktivni', aktivni.length > 0);
  $('#filtryBtn').title = aktivni.length
    ? 'Filtry (f): ' + aktivni.map(s => s.selectedOptions[0].text).join(', ') : 'Filtry (f)';
}
$('#filtryBtn').addEventListener('click', () => $('#filtry').showModal());
$('#filtry').addEventListener('click', ev => { if (ev.target === ev.currentTarget) $('#filtry').close(); });
$('#filtryVymazat').addEventListener('click', () => {
  document.querySelectorAll('#filtry select').forEach(s => { s.value = ''; });
  ulozFiltry();
  vykresli();
});
$('#novy').addEventListener('click', () => otevriNovy());
for (const id of ['#fProjekt', '#fTyp', '#fPriorita', '#fVrstva', '#fResi', '#fNahlasil'])
  $(id).addEventListener('change', () => { ulozFiltry(); vykresli(); });
$('#hledat').addEventListener('input', vykresli);

// ── Oznámení ──────────────────────────────────────────────
// Seznam událostí je společný; co je „nové", počítá každý podle svého
// lide.precteno_do (uloženo v databázi, takže platí na všech zařízeních).

const DRUHY = {
  novy:      { ik: t => IKONA[t] || IKONA.bug, text: t => t === 'ukol' ? 'Nový úkol' : 'Nový bug' },
  resi_se:   { ik: () => '🔧', text: () => 'Řeší se' },
  vyreseno:  { ik: () => '✅', text: t => t === 'ukol' ? 'Úkol hotový' : 'Bug vyřešen' },
  nahlaseno: { ik: () => '↩️', text: () => 'Vráceno mezi nahlášené' },
  obrazek:   { ik: () => '🖼', text: () => 'Nový obrázek' },
  smazano:   { ik: () => '🗑', text: () => 'Smazáno' },
};

// Musí odpovídat VYCHOZI_PRAVIDLA v supabase/functions/bugnik/index.ts.
const VYCHOZI_PRAVIDLA = {
  novy_bug: ['telegram'], novy_ukol: ['telegram'],
  resi_se_bug: [], resi_se_ukol: [],
  vyreseno_bug: ['telegram'], vyreseno_ukol: ['telegram'],
};
const RADKY_PRAVIDEL = [
  ['novy_bug', '🐞 Nový bug'], ['novy_ukol', '📋 Nový úkol'],
  ['resi_se_bug', '🔧 Bug se začal řešit'], ['resi_se_ukol', '🔧 Úkol se začal řešit'],
  ['vyreseno_bug', '✅ Bug vyřešen'], ['vyreseno_ukol', '✅ Úkol hotový'],
];

// Přes Date, ne řetězce: klient píše „…Z", databáze vrací „…+00:00" s jiným počtem desetin.
const jeNova = u => u.kdo !== ja && Date.parse(u.created_at) > Date.parse(ja_radek.precteno_do);

function pred(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'právě teď';
  if (s < 3600) return `před ${Math.floor(s / 60)} min`;
  if (s < 86400) return `před ${Math.floor(s / 3600)} h`;
  if (s < 7 * 86400) return `před ${Math.floor(s / 86400)} d`;
  return datum(iso);
}

function obnovZvonek() {
  const n = udalosti.filter(jeNova).length;
  const o = $('#zvonek .odznak');
  o.hidden = !n;
  o.textContent = n > 99 ? '99+' : n;
  document.title = n ? `(${n}) Bugník` : 'Bugník';
}

function novaUdalost(u) {
  if (udalosti.some(x => x.id === u.id)) return;
  udalosti.unshift(u);
  udalosti.length = Math.min(udalosti.length, POCET_UDALOSTI);
  obnovZvonek();
  if ($('#oznameni').open) vykresliUdalosti();
  if (u.kdo !== ja) upozorniVProhlizeci(u);
}

async function prenactiUdalosti() {
  try {
    udalosti = await dotaz(sb.from('udalosti').select('*').order('created_at', { ascending: false }).limit(POCET_UDALOSTI));
    obnovZvonek();
  } catch (e) { console.error(e); }
}

function vykresliUdalosti() {
  const box = $('#oznameni .udalosti');
  if (!udalosti.length) { box.replaceChildren(el('p', { class: 'poznamka', text: 'Zatím se nic nestalo.' })); return; }
  box.replaceChildren(...udalosti.map(u => {
    const d = DRUHY[u.druh] || { ik: () => '•', text: () => u.druh };
    const existuje = bugy.has(u.bug_id);
    return el('button', {
      type: 'button', class: ['udalost', jeNova(u) && 'nova', !existuje && 'pryc'].filter(Boolean).join(' '),
      onclick: () => { if (!existuje) return; $('#oznameni').close(); otevriDetail(u.bug_id); },
    },
      el('span', { class: 'ik', text: d.ik(u.typ) }),
      el('span', { class: 'co', text: `#${u.bug_id} ${bugy.get(u.bug_id)?.nazev ?? u.nazev}` }),
      el('span', { class: 'kdy', text: `${d.text(u.typ)} · ${jmeno(u.kdo)} · ${pred(u.created_at)}` }));
  }));
}

$('#zvonek').addEventListener('click', async () => {
  vykresliUdalosti();          // „nové" se ukážou zvýrazněné…
  $('#oznameni').showModal();
  // Přečteno do času nejnovější události (čas serveru), ne do hodin tohoto zařízení —
  // kdyby šly napřed, další oznámení by vypadala jako stará a kolečko by se neukázalo.
  const ted = udalosti[0]?.created_at;
  // Ukládá se i „dozadu": srovná precteno_do, které dřív uložily hodiny jdoucí napřed.
  if (!ted || Date.parse(ted) === Date.parse(ja_radek.precteno_do)) return;
  try {                        // …a hned se označí jako viděné (jen pro mě)
    await dotaz(sb.from('lide').update({ precteno_do: ted }).eq('id', ja));
    ja_radek.precteno_do = ted;
    obnovZvonek();
  } catch (e) { console.error(e); }
});
$('#oznameni').addEventListener('click', ev => {
  if (ev.target === ev.currentTarget || ev.target.closest('[data-zavrit]')) $('#oznameni').close();
});

// Upozornění v prohlížeči (jen když je Bugník otevřený někde na pozadí).
// Zapíná se zvlášť v každém prohlížeči, proto localStorage, ne databáze.
const prohlizecZapnut = () => { try { return localStorage.getItem('bugnik-notif') === '1'; } catch { return false; } };
function upozorniVProhlizeci(u) {
  if (!prohlizecZapnut() || !('Notification' in window) || Notification.permission !== 'granted') return;
  if (!document.hidden) return;
  const d = DRUHY[u.druh];
  const n = new Notification(`${d?.text(u.typ) ?? u.druh} · ${jmeno(u.kdo)}`, { body: `#${u.bug_id} ${u.nazev}`, tag: 'bugnik-' + u.id });
  n.onclick = () => { window.focus(); if (bugy.has(u.bug_id)) otevriDetail(u.bug_id); n.close(); };
}

// ── Nastavení ─────────────────────────────────────────────
const dlgNast = $('#nastaveni');
const formNast = dlgNast.firstElementChild;
dlgNast.addEventListener('click', ev => { if (ev.target === dlgNast) dlgNast.close(); });

async function ulozNastaveni(zmeny) {
  const nastaveni = { ...ja_radek.nastaveni, ...zmeny };
  await dotaz(sb.from('lide').update({ nastaveni }).eq('id', ja));
  ja_radek.nastaveni = nastaveni;
}

function vykresliTelegram() {
  const box = $('.tg-stav', formNast);
  if (!box) return;
  const n = ja_radek.nastaveni || {};
  const bot = BUGNIK.telegramBot;
  if (!bot) { box.replaceChildren(el('span', { class: 'poznamka', text: 'Telegram zatím není nastavený (chybí bot v config.js).' })); return; }
  if (n.telegram_chat_id) {
    box.replaceChildren(el('span', { class: 'ok', text: '✓ Propojeno' }),
      el('button', { type: 'button', class: 'btn', text: 'Odpojit', onclick: async () => {
        try { await ulozNastaveni({ telegram_chat_id: null }); vykresliTelegram(); } catch (e) { chyba(e); }
      } }));
    return;
  }
  box.replaceChildren(el('span', { text: 'Nepropojeno' }),
    el('button', { type: 'button', class: 'btn primary', text: 'Propojit Telegram', onclick: async () => {
      // Jednorázový kód: bot ho dostane přes /start a podle něj pozná, kdo jsi.
      const kod = crypto.randomUUID().replaceAll('-', '');
      try {
        await ulozNastaveni({ telegram_kod: kod });
        window.open(`https://t.me/${bot}?start=${kod}`, '_blank');
        box.replaceChildren(el('span', { class: 'poznamka',
          text: 'V Telegramu klikni na START. Až bot odpoví „Propojeno ✅“, ukáže se to i tady.' }));
      } catch (e) { chyba(e); }
    } }));
}

function otevriNastaveni() {
  const n = ja_radek.nastaveni || {};
  const pravidla = { ...VYCHOZI_PRAVIDLA, ...(n.pravidla || {}) };
  const ulozPravidla = async () => {
    const nova = {};
    for (const [klic] of RADKY_PRAVIDEL)
      nova[klic] = ['telegram', 'email'].filter(k => formNast.elements[`${klic}:${k}`].checked);
    try { await ulozNastaveni({ pravidla: nova }); stav.textContent = 'Uloženo ✓'; } catch (e) { chyba(e); }
  };
  const stav = el('span', { class: 'ulozeno poznamka' });
  const podporaProhl = 'Notification' in window;

  formNast.replaceChildren(
    el('h3', {}, '⚙ Nastavení', el('button', { type: 'button', class: 'btn', text: 'Zavřít', onclick: () => dlgNast.close() })),
    el('label', {}, 'Jméno na kartách', el('input', { name: 'jmeno', value: jmeno(ja), maxlength: 40,
      onchange: async ev => {
        const v = ev.target.value.trim();
        if (!v) return;
        try {
          await dotaz(sb.from('lide').update({ jmeno: v }).eq('id', ja));
          lide.set(ja, v);
          $('#mojeJmeno').textContent = v;
          vykresli();
          stav.textContent = 'Uloženo ✓';
        } catch (e) { chyba(e); }
      } })),
    el('label', {}, 'E-mail pro oznámení', el('input', { name: 'email', type: 'email', value: n.email ?? mujEmail,
      placeholder: mujEmail, onchange: async ev => {
        try { await ulozNastaveni({ email: ev.target.value.trim() }); stav.textContent = 'Uloženo ✓'; } catch (e) { chyba(e); }
      } })),
    el('label', {}, 'Telegram', el('div', { class: 'tg-stav' })),
    el('div', {},
      el('table', { class: 'matice' },
        el('thead', {}, el('tr', {}, el('th', { text: 'Kam co posílat' }), el('th', { text: 'Telegram' }), el('th', { text: 'E-mail' }))),
        el('tbody', {}, RADKY_PRAVIDEL.map(([klic, popisek]) => el('tr', {},
          el('td', { text: popisek }),
          ['telegram', 'email'].map(k => el('td', {}, el('input', { type: 'checkbox', name: `${klic}:${k}`,
            checked: pravidla[klic]?.includes(k), onchange: ulozPravidla }))))))),
      el('p', { class: 'poznamka', text: 'Všechno ostatní (vrácení, obrázky, smazání) uvidíš v 🔔 na webu.' })),
    el('label', { class: 'chk' }, el('input', { type: 'checkbox', checked: !!n.sve, onchange: async ev => {
      try { await ulozNastaveni({ sve: ev.target.checked }); stav.textContent = 'Uloženo ✓'; } catch (e) { chyba(e); }
    } }), 'Posílat zprávy i o mých vlastních akcích'),
    el('label', { class: 'chk' }, el('input', { type: 'checkbox', checked: prohlizecZapnut(), disabled: !podporaProhl,
      onchange: async ev => {
        const zap = ev.target.checked;
        if (zap && Notification.permission !== 'granted' && await Notification.requestPermission() !== 'granted') {
          ev.target.checked = false;
          alert('Prohlížeč upozornění nepovolil. Povol je v nastavení stránky (ikona zámku vedle adresy).');
          return;
        }
        try { localStorage.setItem('bugnik-notif', zap ? '1' : '0'); } catch {}
      } }), 'Upozornění v tomhle prohlížeči, když mám Bugník otevřený na pozadí'),
    stav,
  );
  vykresliTelegram();
  dlgNast.showModal();
}
$('#ozubene').addEventListener('click', otevriNastaveni);
$('#mojeJmeno').addEventListener('click', otevriNastaveni);

document.addEventListener('keydown', ev => {
  if (document.querySelector('dialog[open]') || ev.target.closest('input, textarea, select') || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === '/') { ev.preventDefault(); $('#hledat').focus(); }
  if (ev.key === 'n') { ev.preventDefault(); otevriNovy(); }
  if (ev.key === 'f') { ev.preventDefault(); $('#filtry').showModal(); }
});
</script>
</body>
</html>
